name: Update Mark Six data and analysis

on:
  schedule:
    # GitHub Actions cron uses UTC. 14:30 UTC = 22:30 Hong Kong Time (UTC+8), every day.
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mark-six-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update public results and analysis
        run: python updater.py

      - name: Commit generated data when changed
        run: |
          if [ -z "$(git status --porcelain -- data/lotto_history_real.csv data/latest_prediction.json)" ]; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto_history_real.csv data/latest_prediction.json
          git commit -m "chore(data): update Mark Six results and analysis"
          git push origin main
