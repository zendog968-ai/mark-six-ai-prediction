name: Update Mark Six data and analysis

on:
  schedule:
    # GitHub Actions cron uses UTC. 14:00 UTC = 22:00 Hong Kong Time (UTC+8), every day.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mark-six-data-update
  cancel-in-progress: false

env:
  STREAMLIT_HEALTH_URL: https://mark-six-ai-prediction-kdaaxgkknz94c7fbylxigj.streamlit.app/healthz

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update public results and analysis
        run: python updater.py

      - name: Commit generated data when changed
        run: |
          if [ -z "$(git status --porcelain -- data/lotto_history_real.csv data/latest_prediction.json data/prediction_history.json)" ]; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto_history_real.csv data/latest_prediction.json data/prediction_history.json
          git commit -m "chore(data): update Mark Six results and analysis"
          git push origin main

      - name: Verify public Streamlit deployment
        run: |
          for attempt in 1 2 3; do
            echo "Deployment health check attempt ${attempt}/3"
            if curl --fail --silent --show-error --location \
              --connect-timeout 20 --max-time 60 "$STREAMLIT_HEALTH_URL"; then
              echo "Public Streamlit deployment is reachable."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Deployment is not reachable yet; waiting 20 seconds before retrying."
              sleep 20
            fi
          done
          echo "Public Streamlit deployment health check failed after 3 attempts." >&2
          exit 1
